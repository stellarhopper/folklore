name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  notify-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Send MQTT deployment trigger
        env:
          # Passed through the environment rather than interpolated into the
          # script body, so the values never appear in the expanded command.
          MQTT_BROKER: ${{ secrets.MQTT_BROKER }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
        run: |
          set -euo pipefail

          for var in MQTT_BROKER MQTT_USERNAME MQTT_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Repository secret $var is not set"
              exit 1
            fi
          done

          # Install mosquitto clients for MQTT publishing
          sudo apt-get update
          sudo apt-get install -y mosquitto-clients

          # Publish deployment message
          mosquitto_pub \
            -h "$MQTT_BROKER" \
            -p 8883 \
            -t "folklore/deploy" \
            -m "deploy" \
            -u "$MQTT_USERNAME" \
            -P "$MQTT_PASSWORD" \
            --capath /etc/ssl/certs/

          echo "Deployment notification sent to Raspberry Pi via MQTT"